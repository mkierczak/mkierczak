project:
  type: website
  output-dir: docs
  resources:
    - publications.json
    - paper-notes.json
    - publication-counts.json
    - assets/icons/*.svg
    - assets/bg.js
    - assets/docs/*.pdf
    - robots.txt
    - CNAME
  render:
    - "*.qmd"
    - "posts/**/*.qmd"

website:
  title: "Marcin Kierczak"
  description: "Marcin Kierczak, PhD — Training and Industry Outreach Coordinator and Data Scientist at NBIS and Associate Professor of Bioinformatics / SciLifeLab, Uppsala, Sweden."
  site-url: https://kierczak.net
  favicon: assets/marcin.jpg
  open-graph: true
  twitter-card:
    card-style: summary
  search: false
  navbar:
    background: primary
    pinned: true
    title: "Marcin Kierczak"
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Training & Outreach
      - href: publications.qmd
        text: Publications
      - href: blog.qmd
        text: Blog
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact
    tools:
      - icon: google
        href: https://scholar.google.com/citations?user=ebOBIL4AAAAJ
        aria-label: Google Scholar
      - icon: linkedin
        href: https://www.linkedin.com/in/marcinkierczak
        aria-label: LinkedIn
      - icon: rss
        href: blog.xml
        aria-label: RSS feed
  page-footer:
    left: "© 1998-2026 Marcin Kierczak"
    right: "Uppsala, Sweden · Built with human brain, [Quarto](https://quarto.org) & [Claude](https://claude.com)"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    include-in-header:
      - text: |
          <script type="application/ld+json">{"@context": "https://schema.org", "@type": "Person", "name": "Marcin Kierczak", "url": "https://kierczak.net/", "image": "https://kierczak.net/assets/marcin.jpg", "jobTitle": "Training and Industry Outreach Coordinator and Data Scientist; Associate Professor of Bioinformatics", "worksFor": {"@type": "Organization", "name": "National Bioinformatics Infrastructure Sweden (NBIS), SciLifeLab", "url": "https://nbis.se"}, "affiliation": {"@type": "CollegeOrUniversity", "name": "Uppsala University", "url": "https://www.uu.se"}, "alumniOf": {"@type": "CollegeOrUniversity", "name": "Uppsala University"}, "knowsAbout": ["Bioinformatics", "Statistical genomics", "Machine learning", "Ancient DNA", "Metagenomics", "R programming"], "sameAs": ["https://orcid.org/0000-0003-2629-5655", "https://www.linkedin.com/in/marcinkierczak", "https://scholar.google.com/citations?user=ebOBIL4AAAAJ"]}</script>
    toc: false
    smooth-scroll: true
    code-copy: true
    highlight-style:
      light: github
      dark: github
    link-external-newwindow: true
    mainfont: "Newsreader"
    fontsize: 1.12rem
    linestretch: 1.7
